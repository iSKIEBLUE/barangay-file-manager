<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay File Manager — Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1f3d;
      --navy-mid: #162847;
      --navy-light: #1e3a5f;
      --gold: #c9a84c;
      --gold-light: #e2c16e;
      --cream: #f4f6fb;
      --cream-dark: #e8edf5;
      --text-main: #1a1a2e;
      --text-muted: #6b7a99;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background-color: var(--cream); min-height: 100vh; margin: 0; }
    .font-display { font-family: 'Lora', serif; }

    header { background: var(--navy); border-bottom: 3px solid var(--gold); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .header-logo { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-text { min-width: 0; }
    .logo-text h1 { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; color: #fff; letter-spacing: -0.3px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo-text p { font-size: 10px; color: var(--gold); margin: 0; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }

    #header-user { display: none; align-items: center; gap: 20px; }
    #header-user:not(.hidden) { display: flex; }
    #resident-name { font-weight: 600; font-size: 14px; color: #fff; margin: 0; }
    #resident-email { font-size: 12px; color: var(--gold); margin: 0; }
    #logout-btn { background: transparent; border: 1.5px solid rgba(201,168,76,0.5); color: var(--gold-light); font-size: 13px; font-weight: 500; padding: 7px 18px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: 'Outfit', sans-serif; }
    #logout-btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }

    /* Dark mode toggle */
    #theme-toggle { background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    #theme-toggle:hover { background: rgba(255,255,255,0.2); }

    body.dark { background-color: #111827; }
    body.dark .auth-card { background: #1f2937; border-color: rgba(255,255,255,0.08); box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    body.dark .auth-card h2 { color: #f9fafb; }
    body.dark .auth-card .subtitle { color: #9ca3af; }
    body.dark .field label { color: #e5e7eb; }
    body.dark .field input { background: #111827; border-color: #374151; color: #f9fafb; }
    body.dark .field input::placeholder { color: #4b5563; }
    body.dark .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); background: #1a2332; }
    body.dark .tab-bar { background: #1f2937; }
    body.dark .tab-bar button { color: #6b7280; }
    body.dark .tab-bar button.active { background: var(--navy-light); }
    body.dark .admin-hint { color: #6b7280; }
    body.dark footer { color: #4b5563; }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }

    #auth-section { max-width: 440px; margin: 0 auto; animation: fadeUp 0.4s ease both; }

    @media (max-width: 480px) {
      main { padding: 20px 12px; }
      .auth-card { padding: 24px 16px; }
      .auth-card h2 { font-size: 22px; }
      #resident-name, #resident-email { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #logout-btn { padding: 6px 10px; font-size: 12px; }
      .logo-text h1 { font-size: 13px; }
    }

    .tab-bar { display: flex; margin-bottom: 28px; background: var(--cream-dark); border-radius: 10px; padding: 4px; }
    .tab-bar button { flex: 1; padding: 10px; font-size: 14px; font-weight: 600; border: none; background: transparent; border-radius: 7px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; font-family: 'Outfit', sans-serif; }
    .tab-bar button.active { background: var(--navy); color: #fff; box-shadow: 0 2px 8px rgba(15,31,61,0.25); }

    .auth-card { background: #fff; border-radius: 16px; padding: 36px; box-shadow: 0 4px 24px rgba(15,31,61,0.08), 0 1px 4px rgba(15,31,61,0.05); border: 1px solid rgba(15,31,61,0.06); }
    .auth-card h2 { font-family: 'Lora', serif; font-size: 26px; font-weight: 600; color: var(--text-main); margin: 0 0 5px 0; }
    .auth-card .subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 28px 0; }

    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; letter-spacing: 0.3px; }
    .field input { width: 100%; border: 1.5px solid #dde3ef; border-radius: 9px; padding: 11px 14px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--text-main); background: #fafbfd; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .field input:focus { border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(30,58,95,0.1); background: #fff; }
    .field input::placeholder { color: #b0b8cc; }

    .btn-primary { width: 100%; background: var(--navy); color: #fff; border: none; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
    .btn-primary:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(15,31,61,0.3); }
    .btn-primary:active { transform: translateY(0); }

    .admin-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 16px; margin-bottom: 0; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    footer { text-align: center; font-size: 12px; color: var(--text-muted); padding: 32px 16px; letter-spacing: 0.3px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9.5L12 3L21 9.5V20C21 20.5523 20.5523 21 20 21H15V15H9V21H4C3.44772 21 3 20.5523 3 20V9.5Z" fill="#0f1f3d"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>Barangay File Manager</h1>
        <p>Resident Portal</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div id="notif-bell-wrap" style="position:relative;display:none">
        <button id="notif-bell" onclick="toggleNotifPanel()" title="Notifications" style="background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;position:relative">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notif-count" style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px">0</span>
        </button>
        <div id="notif-panel" style="display:none;position:absolute;top:44px;right:0;width:min(320px, calc(100vw - 32px));background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(15,31,61,0.18);border:1px solid #e2e8f0;z-index:100;overflow:hidden;color:#1a1a2e">
          <div style="padding:12px 16px;border-bottom:1px solid #f3f4f6;font-weight:600;font-size:14px;color:#1f2937">Notifications</div>
          <div id="notif-list"></div>
        </div>
      </div>
      <button id="theme-toggle" title="Toggle dark mode" style="background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);color:#fff;width:36px;height:36px;min-width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;width:16px;height:16px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div id="header-user">
        <div style="text-align:right">
          <p id="resident-name"></p>
          <p id="resident-email"></p>
        </div>
        <button id="logout-btn">Log Out</button>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- AUTH SECTION -->
  <section id="auth-section">
    <div class="tab-bar">
      <button id="tab-login" class="active">Log In</button>
      <button id="tab-register">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your resident account</p>
      <div class="field">
        <label>Email</label>
        <input id="login-email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="login-password" type="password" required placeholder="••••••••" />
      </div>
      <button id="login-btn" type="submit" class="btn-primary">Log In</button>

    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-card hidden">
      <h2>Create account</h2>
      <p class="subtitle">Join the resident portal today</p>
      <div class="field">
        <label>Full Name</label>
        <input id="reg-name" type="text" required placeholder="Juan dela Cruz" />
      </div>
      <div class="field">
        <label>Email</label>
        <input id="reg-email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="reg-password" type="password" required placeholder="Min. 8 characters" />
      </div>
      <div class="field">
        <label>Phone</label>
        <input id="reg-phone" type="tel" placeholder="09XXXXXXXXX" />
      </div>
      <div class="field">
        <label>Home Address</label>
        <input id="reg-address" type="text" placeholder="123 Rizal St., Brgy. …" />
      </div>
      <button id="register-btn" type="submit" class="btn-primary">Create Account</button>
    </form>
  </section>

  <!-- DASHBOARD SECTION -->
  <section id="dashboard-section" class="hidden space-y-8">
    <div class="bg-white rounded-2xl shadow-md p-6">
      <h2 class="font-display text-xl font-bold text-gray-800 mb-4">Request a Document</h2>
      <form id="request-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Document Type <span class="text-red-500">*</span>
          </label>
          <select id="doc-type-select"
                  class="w-full border rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">— Select a document —</option>
          </select>
        </div>
        <div id="requirements-box" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-4">
          <p class="text-sm font-semibold text-blue-800 mb-2">Requirements to bring:</p>
          <ul id="requirements-list" class="text-sm text-blue-700 space-y-1 list-none pl-0"></ul>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Purpose / Reason</label>
          <textarea id="purpose-input" rows="3"
                    placeholder="e.g., For employment requirements"
                    class="w-full border rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </div>
        <button id="submit-request-btn" type="submit"
                class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition-colors">
          Submit Request
        </button>
      </form>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-display text-xl font-bold text-gray-800">My Requests</h2>
        <button onclick="loadResidentRequests()" class="text-sm text-blue-600 hover:underline">↻ Refresh</button>
      </div>
      <div id="requests-container" class="space-y-3">
        <p class="text-gray-400 text-sm">Loading…</p>
      </div>
    </div>
  </section>
</main>



<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    var sun = document.getElementById('theme-icon-sun');
    var moon = document.getElementById('theme-icon-moon');
    var dark = localStorage.getItem('bfm_theme') === 'dark';
    function apply(d) {
      document.body.classList.toggle('dark', d);
      sun.style.display = d ? 'block' : 'none';
      moon.style.display = d ? 'none' : 'block';
    }
    apply(dark);
    btn.addEventListener('click', function() {
      dark = !dark;
      localStorage.setItem('bfm_theme', dark ? 'dark' : 'light');
      apply(dark);
    });
  })();
</script>
<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    initResidentPage();
  });
</script>
</body>
</html>
